
<!-- Admin Route Header -->
<app-header *ngIf="!isAdminRoute"></app-header>

@if (loader.loading$ | async) {
  <div class="app-loader-overlay">
    <div class="app-loader-spinner"></div>
  </div>
}
<router-outlet></router-outlet>

<!-- Floating cart button — only on the marketplace storefront -->
<app-cart-fab *ngIf="isMarketplaceRoute"></app-cart-fab>

<!-- AI assistant — admin, marketplace aur ek chat conversation ke andar nahi.
     Marketplace par cart FAB usi jagah baithta hai (dono overlap karte the),
     aur assistant sirf rides ke liye hai — products ke baare me kuch nahi jaanta. -->
<app-chatbot-widget *ngIf="!isAdminRoute && !isMarketplaceRoute && !isChatThreadRoute"></app-chatbot-widget>


<app-footer *ngIf="!isAdminRoute"></app-footer>
