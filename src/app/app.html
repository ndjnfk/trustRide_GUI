
<!-- Admin Route Header -->
<app-header *ngIf="!isAdminRoute"></app-header>

@if (loader.loading$ | async) {
  <div class="app-loader-overlay">
    <div class="app-loader-spinner"></div>
  </div>
}
<router-outlet></router-outlet>

<!-- Floating cart button — only on the marketplace storefront -->
<app-cart-fab *ngIf="isMarketplaceRoute"></app-cart-fab>

<!-- AI assistant — available everywhere except admin and inside a chat conversation
     (the chat composer's send button would otherwise sit behind this FAB on mobile) -->
<app-chatbot-widget *ngIf="!isAdminRoute && !isChatThreadRoute"></app-chatbot-widget>


<app-footer *ngIf="!isAdminRoute"></app-footer>
